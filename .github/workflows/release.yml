name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.1.0)"
        required: true

permissions: {}

# One run at a time, so a run sees the tag that the run before it pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect release target
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source to resolve version
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
            VERSION="${TAG#v}"
          else
            VERSION="$(sed -n 's/^  @version "\([^"]*\)"$/\1/p' mix.exs | head -n1)"

            if [ -z "$VERSION" ]; then
              echo "Failed to read current mix.exs version" >&2
              exit 1
            fi

            TAG="v$VERSION"
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          # A push releases the mix.exs version when its tag does not exist.
          # So the next push repairs a run that stopped before it pushed the
          # tag. A tag without a release needs a manual dispatch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$TAG_EXISTS" = "false" ]; then
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when the release tag exists
        if: steps.resolve.outputs.should_release != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: echo "$TAG already exists; release skipped"

  tag:
    name: Create and push release tag
    runs-on: ubuntu-latest
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.should_release == 'true'
    permissions:
      contents: write # push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] this job pushes a git tag and requires persisted credentials

      - name: Create and push release tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$TAG"
          git push origin "$TAG"

  release:
    name: GitHub Release
    needs:
      - detect
      - tag
    if: always() && needs.detect.outputs.should_release == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create release
        # zizmor: ignore[superfluous-actions] action-gh-release handles release-notes generation and asset upload more reliably than an inline gh script
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: main
          generate_release_notes: true
