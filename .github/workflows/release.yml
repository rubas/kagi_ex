name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v0.1.0)"
        required: true

permissions: {}

# One run at a time, so a run sees the tag that the run before it pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
  # Keep every pending run. A newer push would otherwise cancel the pending run of the version
  # bump, and tag its own commit.
  queue: max

jobs:
  detect:
    name: Detect release target
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout source to resolve version
    outputs:
      should_release: ${{ steps.resolve.outputs.should_release }}
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatch releases and publishes a tag that exists. For a missing tag, the GitHub
            # release would create it at main.
            TAG="$INPUT_TAG"
            if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              echo "Tag $TAG does not exist" >&2
              exit 1
            fi
            VERSION="$(git show "refs/tags/$TAG:mix.exs" | sed -n 's/^  @version "\([^"]*\)"$/\1/p' | head -n1)"
            if [ "$TAG" != "v$VERSION" ]; then
              echo "Tag $TAG has @version $VERSION in mix.exs" >&2
              exit 1
            fi
          else
            VERSION="$(sed -n 's/^  @version "\([^"]*\)"$/\1/p' mix.exs | head -n1)"

            if [ -z "$VERSION" ]; then
              echo "Failed to read current mix.exs version" >&2
              exit 1
            fi

            TAG="v$VERSION"
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          # A push releases the mix.exs version when its tag does not exist.
          # So the next push repairs a run that stopped before it pushed the
          # tag. A tag without a release needs a manual dispatch.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$TAG_EXISTS" = "false" ]; then
            SHOULD_RELEASE=true
          else
            SHOULD_RELEASE=false
          fi

          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Skip when the release tag exists
        if: steps.resolve.outputs.should_release != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: echo "$TAG already exists; release skipped"

  tag:
    name: Create and push release tag
    runs-on: ubuntu-latest
    needs: detect
    if: github.event_name == 'push' && needs.detect.outputs.should_release == 'true'
    permissions:
      contents: write # push the release tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # zizmor: ignore[artipacked] this job pushes a git tag and requires persisted credentials

      - name: Create and push release tag
        env:
          TAG: ${{ needs.detect.outputs.tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag "$TAG"
          git push origin "$TAG"

  release:
    name: GitHub Release
    needs:
      - detect
      - tag
    if: always() && needs.detect.outputs.should_release == 'true' && (needs.tag.result == 'success' || needs.tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Create release
        # zizmor: ignore[superfluous-actions] action-gh-release handles release-notes generation and asset upload more reliably than an inline gh script
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          target_commitish: main
          generate_release_notes: true

  publish:
    name: Publish to Hex
    needs:
      - detect
      - release
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    # The Hex workload identity of the package names this environment and this workflow file.
    environment: hex
    permissions:
      contents: read # check out the release tag
      id-token: write # mix hex.publish exchanges the job's OIDC token for a Hex token
    steps:
      # The tag, not main: a PR that merges after the version bump must not ship as this version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.detect.outputs.tag }}
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        env:
          INSTALL_DIR_FOR_OTP: ${{ runner.tool_cache }}/setup-beam/otp-29.1.2
          INSTALL_DIR_FOR_ELIXIR: ${{ runner.tool_cache }}/setup-beam/elixir-1.20.5
        with:
          elixir-version: "1.20.5"
          otp-version: "29.1.2"

      - name: Install dependencies
        run: mix deps.get

      # With no Hex credential in the job, Hex publishes through the workload identity. A failed upload
      # of the docs still exits 0, so the step reads the log. Hex refuses a second upload of a version
      # that hex.pm lists, so for such a version, as one approved after a failed docs upload, the step
      # uploads only the docs.
      - name: Publish the package and its docs
        shell: bash
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          case "$(curl -sS -o /dev/null -w '%{http_code}' "https://hex.pm/api/packages/kagi_ex/releases/$VERSION")" in
            404) ARGS=() ;;
            200) ARGS=(docs) ;;
            *) echo "::error::hex.pm did not say whether it lists kagi_ex $VERSION"; exit 1 ;;
          esac
          mix hex.publish "${ARGS[@]}" --yes 2>&1 | tee "$RUNNER_TEMP/publish.log"
          if grep -E 'Publishing (docs )?failed' "$RUNNER_TEMP/publish.log"; then
            exit 1
          fi
